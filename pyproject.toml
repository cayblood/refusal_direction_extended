[project]
name = "refusal-direction-extended"
version = "0.1.0"
description = """\
This project seeks to reproduce the findings of Arditi et al.'s \
"[Refusal in Language Models Is Mediated by a Single Direction]\
(https://arxiv.org/abs/2406.11717)". It also extends those findings by \
comparing refusal directions across Llama 3.2 Instruct model sizes and \
testing whether an alignment-based transfer works between them."""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "matplotlib>=3.9.0",
    "transformer-lens>=3.2.1",
    "transformers>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the importable package is ``lib`` (feature subpackages live
# under src/lib/). Numbered entry scripts in scripts/ import from it.
packages = ["src/lib"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Entry scripts insert src/ onto sys.path before importing lib, so the imports
# after that line are intentionally not at the top of the file.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
