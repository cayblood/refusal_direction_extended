[tools]
python = "3.12"
uv = "latest"

[tasks.setup]
description = "Sync Python dependencies into the active environment"
run = "uv sync"

[tasks.check-env]
description = "Print Python and core ML package versions"
run = "uv run python -c \"from importlib.metadata import version; import sys; print('python', sys.version.split()[0]); print('transformer-lens', version('transformer-lens')); print('transformers', version('transformers')); print('datasets', version('datasets')); print('torch', version('torch')); print('ruff', version('ruff'))\""

[tasks.gpu-check]
description = "Verify the active runtime has CUDA for GPU-dependent tasks"
run = "uv run python -c \"import torch; assert torch.cuda.is_available(), 'CUDA is unavailable; use a GPU runtime or an explicit *-local task'; print(torch.cuda.get_device_name(0))\""

[tasks.lint]
description = "Lint Python files with Ruff"
run = "uv run ruff check ."

[tasks.lint-fix]
description = "Lint Python files with Ruff and apply safe fixes"
run = "uv run ruff check . --fix"

[tasks.format]
description = "Format Python files with Ruff"
run = "uv run ruff format ."

[tasks.format-check]
description = "Check Python formatting with Ruff without modifying files"
run = "uv run ruff format . --check"

[tasks.check]
description = "Run project checks that do not download models or require GPU"
depends = ["lint", "format-check"]

[tasks.hf-login]
description = "Log in to Hugging Face; required for gated Llama model access"
run = "uv run hf auth login"

[tasks.hf-whoami]
description = "Show the active Hugging Face account/token status"
run = "uv run hf auth whoami"

[tasks.download-llama-1b]
description = "Download/cache Llama 3.2 1B Instruct in the active runtime"
run = "uv run hf download meta-llama/Llama-3.2-1B-Instruct --repo-type model"

[tasks.download-llama-3b]
description = "Download/cache Llama 3.2 3B Instruct in the active runtime"
run = "uv run hf download meta-llama/Llama-3.2-3B-Instruct --repo-type model"

[tasks.download-models]
description = "Download/cache both Llama 3.2 Instruct models in the active runtime"
depends = ["download-llama-1b", "download-llama-3b"]

[tasks.download-model]
description = "Alias for download-models"
depends = ["download-models"]

[tasks.prepare-datasets]
description = "Prepare AdvBench/Alpaca refusal-direction datasets locally"
run = "uv run python scripts/prepare_datasets.py"

[tasks.smoke-datasets]
description = "Run a short local generation smoke test on prepared datasets"
run = "uv run python scripts/smoke_datasets.py"

[tasks.baseline]
description = "Run baseline generations on CUDA in the active runtime"
depends = ["gpu-check"]
run = "uv run python scripts/baseline.py --device cuda"

[tasks.baseline-local]
description = "Run baseline generations locally on CPU/MPS/CUDA intentionally"
run = "uv run python scripts/baseline.py --allow-local"

[tasks.collect-activations]
description = "Collect last-token resid_post activations on CUDA in the active runtime"
depends = ["gpu-check"]
run = "uv run python scripts/collect_activations.py --device cuda"

[tasks.collect-activations-local]
description = "Collect activations locally on CPU/MPS/CUDA intentionally"
run = "uv run python scripts/collect_activations.py --allow-local"

[tasks.smoke-activations]
description = "Collect activations for a few prompts locally as a quick smoke test"
run = "uv run python scripts/collect_activations.py --allow-local --model meta-llama/Llama-3.2-1B-Instruct --limit 4 --batch-size 4"

[tasks.extract-directions]
description = "Extract difference-in-means candidate refusal directions from cached activations"
run = "uv run python scripts/extract_directions.py"

[tasks.evaluate-ablation]
description = "Validate refusal directions by ablation on CUDA in the active runtime"
depends = ["gpu-check"]
run = "uv run python scripts/evaluate_ablation.py --device cuda"

[tasks.evaluate-ablation-local]
description = "Validate refusal directions by ablation locally on CPU/MPS/CUDA"
run = "uv run python scripts/evaluate_ablation.py --allow-local"

[tasks.evaluate-quantitative]
description = "Quantitative ablation+addition 2x2 on the test split (CUDA)"
depends = ["gpu-check"]
run = "uv run python scripts/evaluate_quantitative.py --device cuda"

[tasks.evaluate-quantitative-local]
description = "Quantitative ablation+addition 2x2 locally on CPU/MPS/CUDA"
run = "uv run python scripts/evaluate_quantitative.py --allow-local"

[tasks.plot-quantitative]
description = "Plot the addition sweep and 2x2 table (CPU, no GPU)"
run = "uv run python scripts/plot_quantitative.py"

[tasks.evaluate-transfer]
description = "Cross-scale linear transfer of the refusal direction (CUDA)"
depends = ["gpu-check"]
run = "uv run python scripts/evaluate_transfer.py --device cuda"

[tasks.evaluate-transfer-local]
description = "Cross-scale linear transfer of the refusal direction (CPU/MPS/CUDA)"
run = "uv run python scripts/evaluate_transfer.py --allow-local"

[tasks.prepare-generic]
description = "Prepare an independent, format-matched neutral instruction set (transfer control)"
run = "uv run python scripts/prepare_generic.py"

[tasks.collect-generic-activations]
description = "Collect generic-prompt activations for the transfer control (CUDA)"
depends = ["gpu-check"]
run = "uv run python scripts/collect_generic_activations.py --device cuda"

[tasks.collect-generic-activations-local]
description = "Collect generic-prompt activations locally (CPU/MPS/CUDA)"
run = "uv run python scripts/collect_generic_activations.py --allow-local"

[tasks.evaluate-transfer-independent]
description = "Transfer control: fit the alignment map on the independent generic set (CUDA)"
depends = ["gpu-check"]
run = "uv run python scripts/evaluate_transfer_independent.py --device cuda"

[tasks.evaluate-transfer-independent-local]
description = "Transfer control on the independent generic set (CPU/MPS/CUDA)"
run = "uv run python scripts/evaluate_transfer_independent.py --allow-local"

[tasks.runpod-check-config]
description = "Print Runpod SSH configuration derived from environment variables"
run = "uv run python scripts/runpod.py check-config"

[tasks.runpod-sync]
description = "Sync this repository to the configured Runpod pod with rsync"
run = "uv run python scripts/runpod.py sync"

[tasks.runpod-setup]
description = "Install uv and sync dependencies on the configured Runpod pod"
run = "uv run python scripts/runpod.py setup"

[tasks.runpod-gpu-check]
description = "Verify CUDA is available on the configured Runpod pod"
run = "uv run python scripts/runpod.py gpu-check"

[tasks.runpod-download-models]
description = "Download/cache both Llama 3.2 models on the configured Runpod pod"
run = "uv run python scripts/runpod.py download-models"

[tasks.runpod-prepare-datasets]
description = "Prepare AdvBench/Alpaca refusal-direction datasets on the configured Runpod pod"
run = "uv run python scripts/runpod.py prepare-datasets"

[tasks.runpod-smoke-datasets]
description = "Run a short generation smoke test on prepared datasets on Runpod"
run = "uv run python scripts/runpod.py smoke-datasets"

[tasks.runpod-baseline]
description = "Run baseline generations on the configured Runpod pod"
run = "uv run python scripts/runpod.py baseline"

[tasks.runpod-collect-activations]
description = "Collect last-token resid_post activations on the configured Runpod pod"
run = "uv run python scripts/runpod.py collect-activations"

[tasks.runpod-smoke-activations]
description = "Collect activations for a few prompts on Runpod as a quick smoke test"
run = "uv run python scripts/runpod.py collect-activations --limit 4 --batch-size 4 --model meta-llama/Llama-3.2-1B-Instruct"

[tasks.runpod-extract-directions]
description = "Extract candidate refusal directions on the configured Runpod pod"
run = "uv run python scripts/runpod.py extract-directions"

[tasks.runpod-evaluate-ablation]
description = "Validate refusal directions by ablation on the configured Runpod pod"
run = "uv run python scripts/runpod.py evaluate-ablation"

[tasks.runpod-evaluate-quantitative]
description = "Run the quantitative ablation+addition 2x2 on the configured Runpod pod"
run = "uv run python scripts/runpod.py evaluate-quantitative"

[tasks.runpod-evaluate-transfer]
description = "Run the cross-scale linear transfer experiment on the configured Runpod pod"
run = "uv run python scripts/runpod.py evaluate-transfer"

[tasks.runpod-prepare-generic]
description = "Prepare the independent generic instruction set on the configured Runpod pod"
run = "uv run python scripts/runpod.py prepare-generic"

[tasks.runpod-collect-generic-activations]
description = "Collect generic-prompt activations on the configured Runpod pod"
run = "uv run python scripts/runpod.py collect-generic-activations"

[tasks.runpod-evaluate-transfer-independent]
description = "Run the independent-distribution transfer control on the configured Runpod pod"
run = "uv run python scripts/runpod.py evaluate-transfer-independent"

[tasks.runpod-terminate]
description = "Terminate the configured Runpod pod to stop GPU billing (network volume preserved)"
run = "uv run python scripts/runpod.py terminate"

[tasks.runpod-pull-artifacts]
description = "Pull generated artifacts (plots, summaries) from the Runpod pod to the local repo"
run = "uv run python scripts/runpod.py pull artifacts/"

[tasks.runpod-all]
description = "Sync, set up, download models, and run baseline on Runpod"
run = "uv run python scripts/runpod.py all"

[tasks.runpod-check-ephemeral-config]
description = "Print Runpod API pod spec derived from environment variables"
run = "uv run python scripts/runpod.py check-ephemeral-config"

[tasks.runpod-check-h100-config]
description = "Print persistent Runpod H100 pod spec derived from environment variables and .runpod.env"
run = "uv run python scripts/runpod.py check-h100-config"

[tasks.runpod-persistent-h100]
description = "Create/reuse a persistent network volume and retry until an H100 pod is running"
run = "uv run python scripts/runpod.py persistent-h100"

[tasks.runpod-ephemeral]
description = "Create a Runpod pod, run baseline, then terminate it"
run = "uv run python scripts/runpod.py ephemeral"
